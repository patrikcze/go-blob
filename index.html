<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset='utf-8'>
    <title>Go Blob File Uploader</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <script type="text/javascript">
        function copyToClipboard(url) {
            navigator.clipboard.writeText(url)
                .then(() => alert(`Download link copied to clipboard: ${url}`))
                .catch((e) => console.error(e));
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
            font-size: 2rem;
        }

        .file-input-wrapper {
            position: relative;
            margin-bottom: 30px;
        }

        input[type="file"] {
            display: none;
        }

        .file-input-label {
            display: block;
            padding: 15px 30px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .file-input-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .file-name {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 20px;
            min-height: 20px;
        }

        .upload-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .upload-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.3);
        }

        .upload-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .progress-container {
            margin: 20px 0;
        }

        .progress-label {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            border-radius: 15px;
        }

        #response {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f8f9fa;
            color: #495057;
        }

        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 0.8rem;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        .file-size-info {
            color: #999;
            font-size: 0.8rem;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Go Blob File Uploader</h1>

        <form id="uploadForm">
            <div class="file-input-wrapper">
                <input type="file" id="myFile" name="myFile">
                <label for="myFile" class="file-input-label">Choose File</label>
                <div class="file-name" id="fileName">No file selected</div>
            </div>

            <button type="submit" class="upload-btn" id="submitButton">Upload File</button>

            <div class="progress-container">
                <div class="progress-label">Upload Progress</div>
                <div class="progress-bar">
                    <div class="progress-bar-fill" id="progressBarFill">0%</div>
                </div>
            </div>
        </form>

        <div id="response"></div>

        <div class="footer">
            <p>&copy; MaKI | <a href="https://github.com/patrikcze/go-blob" target="_blank">GitHub</a></p>
            <div class="file-size-info">Maximum file size: 4GB</div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('myFile');
        const fileName = document.getElementById('fileName');
        const uploadForm = document.getElementById('uploadForm');
        const submitButton = document.getElementById('submitButton');
        const progressBarFill = document.getElementById('progressBarFill');
        const responseDiv = document.getElementById('response');

        // Handle file selection
        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                fileName.textContent = file.name + ' (' + formatFileSize(file.size) + ')';
                submitButton.disabled = false;
            } else {
                fileName.textContent = 'No file selected';
                submitButton.disabled = true;
            }
        });

        // Format file size helper function
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // Handle form submission
        uploadForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const file = fileInput.files[0];
            if (!file) {
                alert('Please select a file to upload.');
                return;
            }

            // Check file size (4GB limit)
            const maxSize = 4 * 1024 * 1024 * 1024; // 4GB
            if (file.size > maxSize) {
                alert('File size exceeds 4GB limit. Please select a smaller file.');
                return;
            }

            // Disable form during upload
            submitButton.disabled = true;
            submitButton.textContent = 'Uploading...';

            const formData = new FormData();
            formData.append('myFile', file);

            const xhr = new XMLHttpRequest();

            // Upload progress handler
            xhr.upload.addEventListener('progress', function(e) {
                if (e.lengthComputable) {
                    const percentComplete = Math.round((e.loaded / e.total) * 100);
                    progressBarFill.style.width = percentComplete + '%';
                    progressBarFill.textContent = percentComplete + '%';
                }
            });

            // Upload completion handler
            xhr.addEventListener('load', function() {
                submitButton.disabled = false;
                submitButton.textContent = 'Upload File';

                if (xhr.status === 200) {
                    responseDiv.innerHTML = xhr.responseText;
                    progressBarFill.style.width = '100%';
                    progressBarFill.textContent = 'Complete!';
                    
                    // Try to extract and copy download link
                    const links = responseDiv.querySelectorAll('a[href*="blob.core.windows.net"]');
                    if (links.length > 0) {
                        copyToClipboard(links[0].href);
                    }
                } else {
                    responseDiv.innerHTML = '<div style="color: red;">Upload failed. Please try again.</div>';
                    progressBarFill.style.width = '0%';
                    progressBarFill.textContent = '0%';
                }
            });

            // Upload error handler
            xhr.addEventListener('error', function() {
                submitButton.disabled = false;
                submitButton.textContent = 'Upload File';
                responseDiv.innerHTML = '<div style="color: red;">Upload failed. Please try again.</div>';
                progressBarFill.style.width = '0%';
                progressBarFill.textContent = '0%';
            });

            // Start upload
            xhr.open('POST', '/upload', true);
            xhr.send(formData);
        });

        // Initially disable submit button
        submitButton.disabled = true;
    </script>
</body>

</html>
